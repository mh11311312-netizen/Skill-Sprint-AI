{% extends "base.html" %}
{% block heading %}Users and access{% endblock %}
{% block content %}
<div class="panel"><h2>Create user</h2><form method="post" class="row g-2">{{ csrf() }}
  <div class="col-md-3"><input class="form-control form-control-sm" name="username" placeholder="Username" required></div>
  <div class="col-md-3"><input class="form-control form-control-sm" name="password" type="password" placeholder="Password (8+ chars)" required></div>
  <div class="col-md-2"><select class="form-select form-select-sm" name="app_role">{% for r in roles %}<option>{{ r }}</option>{% endfor %}</select></div>
  <div class="col-md-3"><select class="form-select form-select-sm" name="employee_id"><option value="">Linked employee (for employee role)</option>{% for e in employees %}<option value="{{ e.employee_id }}">{{ e.employee_id }} {{ e.full_name }}</option>{% endfor %}</select></div>
  <div class="col-md-1"><button class="btn btn-primary btn-sm w-100">Create</button></div></form></div>
<div class="panel"><table class="table"><thead><tr><th>Username</th><th>Role</th><th>Employee</th><th>Created</th></tr></thead>
{% for u in users %}<tr><td>{{ u.username }}</td><td>{{ u.app_role }}</td><td>{{ u.employee_id or '' }}</td><td>{{ u.created_at|dt }}</td></tr>{% endfor %}</table></div>
{% endblock %}
